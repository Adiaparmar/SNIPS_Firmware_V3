; ============================================================
;  SNIPS V3 — PlatformIO Project Configuration
;
;  ZERO RadioLib / ZERO Adafruit_SSD1306
;  Uses bare-metal SX1262HAL + SSD1306Ascii OledHAL
;
;  Flash commands:
;    pio run -e anchor  --target upload
;    pio run -e relay   --target upload
;    pio run -e relay2  --target upload
;    pio run -e mobile1 --target upload
;    pio run -e mobile2 --target upload
; ============================================================

; ---- Anchor — XIAO ESP32-S3 -----------------------------------
[env:anchor]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino
upload_port   = COM4
lib_deps  =
    greiman/SSD1306Ascii@^1.3.5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DNODE_TYPE_ANCHOR
    -DNODE_ID=0x01
    -DHAS_OLED
    -DANCHOR_X=0.0f
    -DANCHOR_Y=0.0f

; ---- Relay 1 — Arduino Uno R3 ---------------------------------
[env:relay]
platform       = atmelavr
board          = uno
framework      = arduino
upload_port    = COM10
lib_deps =
build_flags =
    -DNODE_TYPE_RELAY
    -DNODE_ID=0x10
    -DRELAY_X=0.0f
    -DRELAY_Y=0.0f
    -DROUTE_TABLE_SIZE=3
    -DNEIGHBOUR_TABLE_SIZE=3
    -DSF_QUEUE_SIZE=1
    -DRREQ_SEEN_SIZE=4
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -lm

; ---- Relay 2 — Arduino Uno R3 ---------------------------------
[env:relay2]
platform       = atmelavr
board          = uno
framework      = arduino
upload_port    = COM9
lib_deps =
build_flags =
    -DNODE_TYPE_RELAY
    -DNODE_ID=0x11
    -DRELAY_X=0.0f
    -DRELAY_Y=0.0f
    -DROUTE_TABLE_SIZE=3
    -DNEIGHBOUR_TABLE_SIZE=3
    -DSF_QUEUE_SIZE=1
    -DRREQ_SEEN_SIZE=4
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -lm

; ---- Mobile 1 — Arduino Nano (ATmega328P) ----------------------
[env:mobile1]
platform       = atmelavr
board          = nanoatmega328
framework      = arduino
upload_port    = COM8
lib_deps =
    greiman/SSD1306Ascii@^1.3.5
